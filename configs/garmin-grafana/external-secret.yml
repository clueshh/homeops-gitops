apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    template:
      data:
        INFLUXDB_USERNAME: admin
        INFLUXDB_PASSWORD: "{{ .influxdb-admin-password }}"
        INFLUXDB_ADMIN_USER: admin
        INFLUXDB_ADMIN_PASSWORD: "{{ .influxdb-admin-password }}"
        GARMINCONNECT_EMAIL: "{{ .garminconnect-email }}"
        GARMINCONNECT_BASE64_PASSWORD: "{{ .garminconnect-password | b64enc }}"
  data:
    - secretKey: influxdb-admin-password
      remoteRef:
        key: InfluxDB Credentials/admin-password
    - secretKey: garminconnect-email
      remoteRef:
        key: Garmin Credentials/email
    - secretKey: garminconnect-password
      remoteRef:
        key: Garmin Credentials/password
