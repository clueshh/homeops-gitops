apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    name: operator-oauth
  data:
    - secretKey: clientId
      remoteRef:
        key: Tailscale Operator/clientId
    - secretKey: clientSecret
      remoteRef:
        key: Tailscale Operator/clientSecret
