apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: argocd
  source:
    path: configs/argocd
    repoURL: https://github.com/clueshh/homeops-gitops.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    - ServerSideApply=true
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
