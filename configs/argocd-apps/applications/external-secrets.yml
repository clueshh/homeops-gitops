apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.2.0
      helm:
        version: v3
        releaseName: external-secrets
        valueFiles:
          - $values/values/external-secrets.yml
    - repoURL: https://github.com/clueshh/homeops-gitops.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/clueshh/homeops-gitops.git
      path: configs/external-secrets
      targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    - ServerSideApply=true
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
