apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: infra
  sources:
    - repoURL: ghcr.io/traefik/helm
      chart: traefik
      targetRevision: 39.0.5
      helm:
        version: v3
        releaseName: traefik
        valueFiles:
          - $values/values/traefik.yml
    - repoURL: https://github.com/clueshh/homeops-gitops.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/clueshh/homeops-gitops.git
      path: configs/traefik
      targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
  destination:
    namespace: traefik
    server: https://kubernetes.default.svc
