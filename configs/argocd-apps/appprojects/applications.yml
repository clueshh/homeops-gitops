---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
spec:
  description: A project for applications
  destinations:
    - namespace: jellyfin
      server: https://kubernetes.default.svc
    - namespace: dashy
      server: https://kubernetes.default.svc
    - namespace: prowlarr
      server: https://kubernetes.default.svc
    - namespace: dispatcharr
      server: https://kubernetes.default.svc
    - namespace: radarr
      server: https://kubernetes.default.svc
    - namespace: sonarr
      server: https://kubernetes.default.svc
  sourceRepos:
    - https://github.com/clueshh/homeops-gitops.git
    - https://jellyfin.github.io/jellyfin-helm
    - https://stakater.github.io/stakater-charts
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
