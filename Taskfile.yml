---
version: "3"

dotenv:
  - .env

vars:
  KUBE_CONTEXT: kind-homeops
  KIND_CLUSTER_NAME: homeops
  KIND_KUBE_CONTEXT: kind-homeops

tasks:
  default:
    desc: Show this help message
    cmds:
      - task --list-all

  kind:up:
    desc: Create kind cluster
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --config kind-config.yml

  kind:down:
    desc: Delete kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  bootstrap:
    desc: Bootstrap the cluster with all resources
    silent: true
    cmds:
      - task: bootstrap:external-secrets
      - task: bootstrap:argocd
      - cmd: "echo -n 'ArgoCD admin password: '"
        silent: true
      - task: argocd:admin-password
        silent: true

  bootstrap:external-secrets:
    desc: Bootstrap External Secrets and the 1Password SecretStore
    cmds:
      - |
        kubectl create namespace external-secrets \
          --context {{.KUBE_CONTEXT}}
      - |
        kubectl create secret generic \
          onepassword-token \
          --context {{.KUBE_CONTEXT}} \
          --namespace external-secrets \
          --from-literal=token="${OP_CONNECT_TOKEN}"

  bootstrap:argocd:
    desc: Bootstrap ArgoCD and the argocd-apps project
    cmds:
      - |
        kubectl apply \
          --server-side \
          --context {{.KUBE_CONTEXT}} \
          -k configs/argocd
      - |
        kubectl apply \
          --context {{.KUBE_CONTEXT}} \
          -k configs/argocd-apps

  argocd:uninstall:
    desc: Uninstall ArgoCD and the argocd-apps project
    cmds:
      - kubectl delete --context {{.KUBE_CONTEXT}} -k configs/argocd

  argocd:admin-password:
    desc: Get the initial admin password for ArgoCD
    cmds:
      - |
        kubectl get secret \
          --context {{.KUBE_CONTEXT}} \
          --namespace argocd \
          argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 --decode
        echo

  grafana:admin-password:
    desc: Get the initial admin password for Grafana
    cmds:
      - |
        kubectl get secret \
          --context {{.KUBE_CONTEXT}} \
          --namespace monitoring \
          kube-prometheus-stack-grafana -o jsonpath="{.data.admin-password}" | base64 --decode
        echo
