# https://github.com/longhorn/charts/tree/v1.12.x/charts/longhorn
longhornUI:
  replicas: 1

metrics:
  serviceMonitor:
    enabled: true

preUpgradeChecker:
  # Must be disabled when installing using Argo CD.
  jobEnabled: false

httproute:
  enabled: false
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - longhorn.lab.whitworth.nz

persistence:
  # Use local-path provisioner by default
  defaultClass: false
  defaultClassReplicaCount: 2

defaultSettings:
  defaultReplicaCount: 2
  allowCollectingLonghornUsageMetrics: false
  storageReservedPercentageForDefaultDisk: 10

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: longhorn
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - longhorn.lab.whitworth.nz
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: authentik-server
              namespace: authentik
              port: 80
