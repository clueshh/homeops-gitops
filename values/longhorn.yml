longhornUI:
  replicas: 1

preUpgradeChecker:
  # Must be disabled when installing using Argo CD.
  jobEnabled: false

httproute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - longhorn.lab.whitworth.nz

persistence:
  # Use local-path provisioner by default
  defaultClass: false

defaultSettings:
  allowCollectingLonghornUsageMetrics: false
