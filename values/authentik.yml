global:
  addPrometheusAnnotations: true

  deploymentAnnotations:
    reloader.stakater.com/auto: "true"

authentik:
  existingSecret:
    secretName: authentik-config

server:
  metrics:
    enabled: true
  route:
    main:
      enabled: true
      hostnames:
        - auth.lab.whitworth.nz
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      matches:
        - path:
            type: PathPrefix
            value: "{{ .Values.authentik.web.path }}"

worker:
  metrics:
    enabled: true

additionalObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: authentik-config
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: 1password
      target:
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            # https://docs.goauthentik.io/install-config/configuration/
            AUTHENTIK_SECRET_KEY: "{{ `{{ .secretKey }}` }}"
            AUTHENTIK_POSTGRESQL__HOST: authentik-db-rw
            AUTHENTIK_POSTGRESQL__PORT: "5432"
            AUTHENTIK_POSTGRESQL__PASSWORD: "{{ `{{ .postgresPassword }}` }}"
            AUTHENTIK_POSTGRESQL__USER: authentik
            AUTHENTIK_POSTGRESQL__NAME: authentik
            # https://docs.goauthentik.io/install-config/email/
            # https://www.reddit.com/r/selfhosted/comments/10c6w7j/notes_about_email_setup_with_authentik/
            AUTHENTIK_EMAIL__HOST: smtp.gmail.com
            AUTHENTIK_EMAIL__PORT: "587"
            AUTHENTIK_EMAIL__USERNAME: campbell@whitworth.nz
            AUTHENTIK_EMAIL__PASSWORD: "{{ `{{ .emailPassword }}` }}"
            AUTHENTIK_EMAIL__USE_TLS: "true"
            AUTHENTIK_EMAIL__USE_SSL: "false"
            AUTHENTIK_EMAIL__TIMEOUT: "10"
            AUTHENTIK_EMAIL__FROM: authentik@whitworth.nz
      data:
        - secretKey: postgresPassword
          remoteRef:
            key: Authentik PostgreSQL/password
        - secretKey: secretKey
          remoteRef:
            key: Authentik Secret Key/password
        - secretKey: emailPassword
          remoteRef:
            key: Authentik Google App Password/password
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: authentik-db-credentials
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: 1password
      target:
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            username: authentik
            password: "{{ `{{ .password }}` }}"
      data:
        - secretKey: password
          remoteRef:
            key: Authentik PostgreSQL/password
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: authentik-db
    spec:
      instances: 1
      bootstrap:
        initdb:
          database: authentik
          owner: authentik
          secret:
            name: authentik-db-credentials
      storage:
        storageClass: longhorn
        size: 1.25Gi
  - apiVersion: gateway.networking.k8s.io/v1beta1
    kind: ReferenceGrant
    metadata:
      name: allow-access-authentik
    spec:
      from:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: media-system
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: longhorn-system
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: traefik
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: adguard
      to:
        - group: ""
          kind: Service
          name: authentik-server
