applicationName: radarr

deployment:
  enabled: true
  image:
    # https://github.com/linuxserver/docker-radarr/pkgs/container/radarr/versions
    repository: lscr.io/linuxserver/radarr
    tag: 6.1.1
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 7878
      name: http
      protocol: TCP
  env:
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    TZ:
      value: Pacific/Auckland
  volumes:
    config:
      configMap:
        name: '{{ template "application.name" . }}-config'
    media:
      persistentVolumeClaim:
        claimName: jellyfin-media
  volumeMounts:
    config:
       mountPath: /config/config.xml
    media:
       mountPath: /media

configMap:
  enabled: true
  files:
   config:
      # Just here to set AuthenticationMethod to External so that Radarr doesn't
      # try to use its own authentication and instead relies on Traefik + Authentik
      config.xml: |
        <Config>
          <BindAddress>*</BindAddress>
          <Port>7878</Port>
          <SslPort>9898</SslPort>
          <EnableSsl>False</EnableSsl>
          <LaunchBrowser>True</LaunchBrowser>
          <ApiKey>22cef46316ec42f597cfe33caadbd2be</ApiKey>
          <AuthenticationMethod>External</AuthenticationMethod>
          <AuthenticationRequired>Enabled</AuthenticationRequired>
          <Branch>master</Branch>
          <LogLevel>debug</LogLevel>
          <SslCertPath></SslCertPath>
          <SslCertPassword></SslCertPassword>
          <UrlBase></UrlBase>
          <InstanceName>Radarr</InstanceName>
          <UpdateMechanism>Docker</UpdateMechanism>
          <AnalyticsEnabled>False</AnalyticsEnabled>
        </Config>

persistence:
  enabled: true
  mountPVC: true
  mountPath: /config
  storageClass: longhorn
  storageSize: 150Mi

service:
  enabled: true
  ports:
    - port: 7878
      name: http
      protocol: TCP
      targetPort: 7878

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - radarr.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
        # - name: '{{ include "application.name" $ }}'
        #   port: 7878
