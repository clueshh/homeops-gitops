applicationName: sonarr

deployment:
  enabled: true
  image:
    # https://github.com/linuxserver/docker-sonarr/pkgs/container/sonarr/versions
    repository: lscr.io/linuxserver/sonarr
    tag: 4.0.17
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 8989
      name: http
      protocol: TCP
  env:
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    TZ:
      value: Pacific/Auckland
  volumes:
    media:
      persistentVolumeClaim:
        claimName: jellyfin-media
  volumeMounts:
    media:
       mountPath: /media

persistence:
  enabled: true
  mountPVC: true
  mountPath: /config
  storageClass: longhorn
  storageSize: 150Mi

service:
  enabled: true
  ports:
    - port: 8989
      name: http
      protocol: TCP
      targetPort: 8989

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - sonarr.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-sonarr
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 8989

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: authentik-sonarr
    spec:
      forwardAuth:
        address: http://ak-outpost-sonarr.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
