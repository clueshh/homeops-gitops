applicationName: sonarr

deployment:
  enabled: true
  image:
    # https://github.com/linuxserver/docker-sonarr/pkgs/container/sonarr/versions
    repository: lscr.io/linuxserver/sonarr
    tag: 4.0.17
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 8989
      name: http
      protocol: TCP
  env:
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    TZ:
      value: Pacific/Auckland
  volumes:
    media:
      persistentVolumeClaim:
        claimName: jellyfin-media
  volumeMounts:
    media:
       mountPath: /media

persistence:
  enabled: true
  mountPVC: true
  mountPath: /config
  storageClass: longhorn
  storageSize: 150Mi

service:
  enabled: true
  ports:
    - port: 8989
      name: http
      protocol: TCP
      targetPort: 8989

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - sonarr.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ak-outpost-sonarr
          namespace: authentik
          port: 9000
        # - name: '{{ include "application.name" $ }}'
        #   port: 8989
