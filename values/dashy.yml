applicationName: dashy

deployment:
  enabled: true
  image:
    repository: ghcr.io/lissy93/dashy
    tag: 3.2.10
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 8080
      name: http
      protocol: TCP
  env:
   NODE_ENV:
      value: "production"
  volumes:
    dashy-volume:
      configMap:
        name: '{{ template "application.name" . }}-config'
  volumeMounts:
    dashy-config:
      name: dashy-volume
      mountPath: /app/user-data
  livenessProbe:
    enabled: true
    exec:
      command: ["node", "/app/services/healthcheck"]
  readinessProbe:
    enabled: true
    exec:
      command: ["node", "/app/services/healthcheck"]
  startupProbe:
    enabled: true
    exec:
      command: ["node", "/app/services/healthcheck"]

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - home.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 8080

configMap:
  enabled: true
  files:
    config:
      conf.yml: |
        pageInfo:
          title: Home Lab
          description: Home Lab Dashboard

        appConfig:
          theme: dashy-docs

        # Main content - An array of sections, each containing an array of items
        sections:
        - name: Today
          icon: far fa-smile-beam
          displayData:
            collapsed: false
            hideForGuests: false
          widgets:
          - type: clock
          - type: public-holidays
            options:
              country: NZ
              region: AK
              holidayType: all
              monthsToShow: 2
              lang: en

        - name: Media
          icon: fas fa-film
          items:
            - title: Jellyfin
              icon: hl-jellyfin
              url: https://jellyfin.lab.whitworth.nz
              description: Media server
              tags: [self-hosted, media, server]
            - title: Sonarr
              icon: hl-sonarr
              url: https://sonarr.lab.whitworth.nz
              description: TV show management
              tags: [self-hosted, media, server]
            - title: Radarr
              icon: hl-radarr
              url: https://radarr.lab.whitworth.nz
              description: Movie management
              tags: [self-hosted, media, server]
            - title: Prowlarr
              icon: hl-prowlarr
              url: https://prowlarr.lab.whitworth.nz
              description: Indexer management
              tags: [self-hosted, media, server]
            - title: Dispatcharr
              icon: hl-dispatcharr
              url: https://dispatcharr.lab.whitworth.nz
              description: IPTV management
              tags: [self-hosted, media, server]
            - title: qBittorrent
              icon: hl-qbittorrent
              url: https://qbittorrent.lab.whitworth.nz
              description: Torrent management
              tags: [self-hosted, media, server]

        - name: System
          icon: fas fa-desktop
          items:
            - title: ArgoCD
              icon: hl-argocd
              url: https://argocd.lab.whitworth.nz
              description: GitOps CD
              tags: [self-hosted, devops, server]
            - title: Grafana
              icon: hl-grafana
              url: https://grafana.lab.whitworth.nz
              description: Metrics & monitoring
              tags: [self-hosted, observability, server]
            - title: Traefik
              icon: hl-traefik-proxy
              url: https://traefik.lab.whitworth.nz
              description: Ingress / reverse proxy
              tags: [self-hosted, devops, server]
            - title: Authentik
              icon: hl-authentik
              url: https://auth.lab.whitworth.nz
              description: Identity provider / SSO
              tags: [self-hosted, auth, server]
            - title: Tailscale
              icon: hl-tailscale
              url: https://login.tailscale.com/admin/machines
              description: VPN
              tags: [self-hosted, dev, server]
            - title: Cloudflare
              icon: hl-cloudflare
              url: https://dash.cloudflare.com
              description: DNS management
              tags: [self-hosted, dev, server]
            - title: AdGuard Home
              icon: hl-adguardhome
              url: https://adguard.lab.whitworth.nz
              description: DNS filtering
              tags: [self-hosted, dev, server]

        - name: Lol
          icon: far fa-laugh
          displayData:
            collapsed: false
            hideForGuests: false
          widgets:
            - type: joke
              options:
                safeMode: true
                language: en
                category: pun
