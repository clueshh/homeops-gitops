applicationName: prowlarr

deployment:
  enabled: true
  image:
    # https://github.com/linuxserver/docker-prowlarr/pkgs/container/prowlarr/versions
    repository: lscr.io/linuxserver/prowlarr
    tag: 2.3.5
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 9696
      name: http
      protocol: TCP
  env:
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    TZ:
      value: Pacific/Auckland

service:
  enabled: true
  ports:
    - port: 9696
      name: http
      protocol: TCP
      targetPort: 9696

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - prowlarr.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 9696
