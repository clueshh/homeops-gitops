persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClass: longhorn
  media:
    enabled: true
    accessMode: ReadWriteMany
    size: 25Gi
    storageClass: longhorn

metrics:
  enabled: true

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - jellyfin.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
