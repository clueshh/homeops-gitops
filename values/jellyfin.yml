persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: ''
  media:
    enabled: true
    size: 100Gi
    storageClass: ''

metrics:
  enabled: true

# AWX - HTTPS access via Tailscale Ingress
# Access at: https://jellyfin.tail72123.ts.net
ingress:
  enabled: true
  className: tailscale
  tls:
   - hosts:
       - jellyfin
  hosts:
    - host: jellyfin
      paths:
        - path: /
          pathType: Prefix

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - jellyfin.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
