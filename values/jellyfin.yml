persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClass: longhorn
  media:
    enabled: true
    accessMode: ReadWriteMany
    size: 25Gi
    storageClass: longhorn

metrics:
  enabled: true

# AWX - HTTPS access via Tailscale Ingress
# Access at: https://jellyfin.tail72123.ts.net
ingress:
  enabled: true
  className: tailscale
  annotations:
    tailscale.com/ingress-hostname: jellyfin
    tailscale.com/tags: "tag:k8s,tag:jellyfin"
  tls:
   - hosts:
       - jellyfin
  hosts:
    - host: jellyfin
      paths:
        - path: /
          pathType: Prefix

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  hostnames:
    - jellyfin.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
