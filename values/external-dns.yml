# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/tags/v0.20.0/charts/external-dns/values.schema.json
provider:
  name: cloudflare

logLevel: debug

sources:
  - gateway-httproute

policy: sync
registry: txt
txtOwnerId: homeops
domainFilters:
  - whitworth.nz

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: api-token
