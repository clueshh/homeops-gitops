  #       - alertmanager.lab.whitworth.nz
  #     rules:
  #       - matches:
  #           - path:
  #               type: PathPrefix
  #               value: /
  #         backendRefs:
  #           - group: ''
  #             kind: Service
  #             name: kube-prometheus-stack-alertmanager
  #             port: 9093
  #             weight: 1
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-oauth-credentials
    spec:
      secretStoreRef:
        name: 1password
        kind: ClusterSecretStore
      target:
        creationPolicy: Owner
      data:
        - secretKey: clientId
          remoteRef:
            conversionStrategy: Default
            decodingStrategy: None
            key: Authentik Grafana Provider/clientId
            metadataPolicy: None
        - secretKey: clientSecret
          remoteRef:
            conversionStrategy: Default
            decodingStrategy: None
            key: Authentik Grafana Provider/clientSecret
            metadataPolicy: None
