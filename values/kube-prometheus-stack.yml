alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: 3GiB
    storageSpec:
     volumeClaimTemplate:
       spec:
         storageClassName: longhorn
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 3Gi

    # Discover ServiceMonitors in ALL namespaces
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false

    # Discover PodMonitors in ALL namespaces
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      # https://github.com/prometheus-community/helm-charts/issues/5232#issuecomment-3689337458
      watchMethod: "SLEEP"
      alertmanager:
        enabled: false
  # http://docs.grafana.org/installation/configuration/
  grafana.ini:
    server:
      domain: "grafana.lab.whitworth.nz"
      root_url: "https://grafana.lab.whitworth.nz"
    auth:
      signout_redirect_url: "https://auth.lab.whitworth.nz/application/o/grafana/end-session/"
      oauth_auto_login: true
    auth.generic_oauth:
      name: authentik
      enabled: true
      client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: "openid profile email"
      auth_url: "https://auth.lab.whitworth.nz/application/o/authorize/"
      token_url: "https://auth.lab.whitworth.nz/application/o/token/"
      api_url: "https://auth.lab.whitworth.nz/application/o/userinfo/"
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/home.json
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-oauth-credentials
        key: clientId
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth-credentials
        key: clientSecret
    INFLUXDB_USERNAME:
      secretKeyRef:
        name: influxdb-auth
        key: influxdb-user
    INFLUXDB_PASSWORD:
      secretKeyRef:
        name: influxdb-auth
        key: influxdb-password
  plugins:
    - marcusolsson-hourly-heatmap-panel
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - uid: DS_GARMIN_STATS
          name: GarminInflux
          type: influxdb
          url: http://influxdb.monitoring.svc.cluster.local:8086
          database: default
          user: $__env{INFLUXDB_USERNAME}
          secureJsonData:
            password: $__env{INFLUXDB_PASSWORD}
  dashboards:
    default:
      argocd-dashboard:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/refs/heads/master/examples/dashboard.json
      longhorn-dashboard:
        gnetId: 16888
        revision: 11
      traefik-dashboard:
        gnetId: 17347
        revision: 9
      external-dns-dashboard:
        gnetId: 15038
        revision: 3
      cert-manager-dashboard:
        gnetId: 20842
        revision: 3
      garmin-dashboard:
        gnetId: 23245
        revision: 2
        datasource:
          - name: DS_GARMIN_STATS
            value: GarminInflux
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

extraManifests:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana-route
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - grafana.lab.whitworth.nz
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ''
              kind: Service
              name: kube-prometheus-stack-grafana
              port: 80
              weight: 1
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: prometheus-route
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - prometheus.lab.whitworth.nz
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ''
              kind: Service
              name: kube-prometheus-stack-prometheus
              port: 9090
              weight: 1
  # - apiVersion: gateway.networking.k8s.io/v1
  #   kind: HTTPRoute
  #   metadata:
  #     name: alertmanager-route
  #   spec:
  #     parentRefs:
  #       - group: gateway.networking.k8s.io
  #         kind: Gateway
  #         name: traefik-gateway
  #         namespace: traefik
  #     hostnames:
  #       - alertmanager.lab.whitworth.nz
  #     rules:
  #       - matches:
  #           - path:
  #               type: PathPrefix
  #               value: /
  #         backendRefs:
  #           - group: ''
  #             kind: Service
  #             name: kube-prometheus-stack-alertmanager
  #             port: 9093
  #             weight: 1
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-oauth-credentials
    spec:
      secretStoreRef:
        name: 1password
        kind: ClusterSecretStore
      target:
        creationPolicy: Owner
      data:
        - secretKey: clientId
          remoteRef:
            conversionStrategy: Default
            decodingStrategy: None
            key: Authentik Grafana Provider/clientId
            metadataPolicy: None
        - secretKey: clientSecret
          remoteRef:
            conversionStrategy: Default
            decodingStrategy: None
            key: Authentik Grafana Provider/clientSecret
            metadataPolicy: None
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-home-dashboard
      labels:
        grafana_dashboard: "1"
    data:
      home.json: |
        {
          "annotations": {
            "list": [
              {
                "builtIn": 1,
                "datasource": {
                  "type": "grafana",
                  "uid": "-- Grafana --"
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "type": "dashboard"
              }
            ]
          },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "links": [],
          "panels": [
            {
              "datasource": {
                "type": "influxdb",
                "uid": "DS_GARMIN_STATS"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": 0
                      }
                    ]
                  },
                  "unit": "lengthm"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 5,
                "w": 4,
                "x": 0,
                "y": 0
              },
              "id": 1,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "percentChangeColorMode": "standard",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "showPercentChange": false,
                "textMode": "auto",
                "wideLayout": true
              },
              "pluginVersion": "12.4.2",
              "targets": [
                {
                  "datasource": {
                    "type": "influxdb",
                    "uid": "DS_GARMIN_STATS"
                  },
                  "query": "SELECT SUM(\"distance\")\nFROM \"ActivitySummary\"\nWHERE \"activityType\"::field = 'running'\n  AND time >= '$start_of_year'\n  AND time <= now()",
                  "rawQuery": true,
                  "refId": "A",
                  "resultFormat": "time_series"
                }
              ],
              "title": "Distance Run YTD",
              "type": "stat"
            }
          ],
          "preload": false,
          "schemaVersion": 42,
          "tags": [],
          "templating": {
            "list": [
              {
                "current": {
                  "text": "2026-01-01T00:00:00Z",
                  "value": "2026-01-01T00:00:00Z"
                },
                "description": "InfluxDB v1 does not support date functions so we hardcode it here",
                "hide": 2,
                "name": "start_of_year",
                "query": "2026-01-01T00:00:00Z",
                "skipUrlSync": true,
                "type": "constant"
              }
            ]
          },
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "timepicker": {},
          "timezone": "browser",
          "title": "Home",
          "uid": "caqdf9l",
          "version": 3,
          "weekStart": ""
        }
