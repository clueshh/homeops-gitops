applicationName: pinchflat

deployment:
  enabled: true
  image:
    repository: ghcr.io/kieraneglin/pinchflat
    tag: latest
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    - containerPort: 8945
      name: http
      protocol: TCP
  env:
    TZ:
      value: Pacific/Auckland
  volumes:
    downloads:
      persistentVolumeClaim:
        claimName: pinchflat-downloads
    config:
      persistentVolumeClaim:
        claimName: pinchflat-config
  volumeMounts:
    downloads:
      mountPath: /downloads
    config:
      mountPath: /config

service:
  enabled: true
  ports:
    - port: 8945
      name: http
      protocol: TCP
      targetPort: 8945

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - pinchflat.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # - name: authentik-server
        #   namespace: authentik
        #   port: 80
        - name: '{{ include "application.name" $ }}'
          port: 8945

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: pinchflat-downloads
      namespace: pinchflat
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: longhorn
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: pinchflat-config
      namespace: pinchflat
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 250Mi
      storageClassName: longhorn
