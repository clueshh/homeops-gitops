# https://github.com/AdguardTeam/Adguardhome/wiki/Configuration#configuration-file
applicationName: adguard

# TODO: Split DNS
# https://burakberk.dev/split-horizon-dns-on-adguard-one-domain-two-networks-two-ip-addresses/
# https://tailscale.com/learn/why-split-dns
deployment:
  enabled: true
  image:
    repository: adguard/adguardhome
    tag: v0.107.73
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  additionalContainers:
    - name: tailscale-sidebar
      image: ghcr.io/tailscale/tailscale:latest
      env:
        # - name: TS_KUBE_SECRET
        #   value: tailscale-auth
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_USERSPACE
          value: "false"
        # required for MagicDNS
        - name: TS_ACCEPT_DNS
          value: 'true'
        - name: TS_EXTRA_ARGS
          value: '--advertise-tags=tag:adguard'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      securityContext:
        capabilities:
           add:
            - NET_ADMIN
  ports:
    # DNS
    - containerPort: 53
      name: dns-udp
      protocol: UDP
    - containerPort: 53
      name: dns-tcp
      protocol: TCP
    # main web interface
    - containerPort: 80
      name: http
      protocol: TCP
    # initial setup web interface
    - containerPort: 3000
      name: setup-http
      protocol: TCP
  volumes:
    adguard-config:
      persistentVolumeClaim:
        claimName: adguard-conf
    adguard-work:
      persistentVolumeClaim:
        claimName: adguard-work
  volumeMounts:
    adguard-config:
       mountPath: /opt/adguardhome/conf
    adguard-work:
       mountPath: /opt/adguardhome/work

service:
  enabled: true
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 80
    - port: 3000
      name: setup-http
      protocol: TCP
      targetPort: 3000

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - adguard.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
        # - name: '{{ include "application.name" $ }}'
        #   port: 80

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: adguard-conf
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Mi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: adguard-work
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Mi
  - apiVersion: v1
    kind: Service
    metadata:
      name: '{{ include "application.name" $ }}-dns'
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.53
        metallb.io/address-pool: adguard-static
    spec:
      selector:
        app.kubernetes.io/name: '{{ include "application.name" $ }}'
      type: LoadBalancer
      ports:
        - port: 53
          name: dns-udp
          protocol: UDP
          targetPort: 53
        - port: 53
          name: dns-tcp
          protocol: TCP
          targetPort: 53
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: tailscale-auth
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: 1password
      data:
        - secretKey: TS_AUTHKEY
          remoteRef:
            key: Tailscale Operator/clientSecret
