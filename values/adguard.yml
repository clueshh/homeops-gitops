# https://github.com/AdguardTeam/Adguardhome/wiki/Configuration#configuration-file
applicationName: adguard

# TODO: Split DNS
# https://burakberk.dev/split-horizon-dns-on-adguard-one-domain-two-networks-two-ip-addresses/
# https://tailscale.com/learn/why-split-dns
deployment:
  enabled: true
  image:
    repository: adguard/adguardhome
    tag: v0.107.73
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    # DNS
    - containerPort: 53
      name: dns-udp
      protocol: UDP
    - containerPort: 53
      name: dns-tcp
      protocol: TCP
    # main web interface
    - containerPort: 80
      name: http
      protocol: TCP
    # initial setup web interface
    - containerPort: 3000
      name: setup-http
      protocol: TCP
  # TODO: Add persistence so configuration is retained across pod restarts.
  volumes:
    # adguard-config:
    #   persistentVolumeClaim:
    #     claimName: adguard-pvc
  volumeMounts:
    # adguard-config:
    #    mountPath: /opt/adguardhome/conf

service:
  enabled: true
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 80
    - port: 3000
      name: setup-http
      protocol: TCP
      targetPort: 3000

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - adguard.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 80

persistence:
  enabled: true
  mountPVC: true
  mountPath: /opt/adguardhome
  accessMode: ReadWriteOnce
  storageClass: longhorn
  storageSize: 50Mi

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: '{{ include "application.name" $ }}-dns'
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.53
        metallb.io/address-pool: adguard-static
    spec:
      selector:
        app.kubernetes.io/name: '{{ include "application.name" $ }}'
      type: LoadBalancer
      ports:
        - port: 53
          name: dns-udp
          protocol: UDP
          targetPort: 53
        - port: 53
          name: dns-tcp
          protocol: TCP
          targetPort: 53
