# https://github.com/AdguardTeam/Adguardhome/wiki/Configuration#configuration-file
applicationName: adguard

deployment:
  enabled: true
  image:
    repository: adguard/adguardhome
    tag: v0.107.73
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    # main web interface
    - containerPort: 80
      name: http
      protocol: TCP
    # initial setup web interface
    - containerPort: 3000
      name: setup-http
      protocol: TCP

service:
  enabled: true
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 80
    - port: 3000
      name: setup-http
      protocol: TCP
      targetPort: 3000

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - adguard.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 80

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: adguard-setup-route
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
      hostnames:
        - setup.adguard.lab.whitworth.nz
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: '{{ include "application.name" $ }}'
              port: 3000
