# https://github.com/AdguardTeam/Adguardhome/wiki/Configuration#configuration-file
applicationName: adguard

deployment:
  enabled: true
  # tailscale writes to the tailscale-auth secret,
  # so we need to disable this to prevent restart loops
  reloadOnChange: false
  image:
    repository: adguard/adguardhome
    tag: v0.107.73
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  additionalContainers:
    # Required for split-horizon DNS. The following filter rule must exist in AdGuard Home
    # where 100.101.57.95 is the Tailscale IP of the Traefik service.
    # ||lab.whitworth.nz^$dnsrewrite=NOERROR;A;100.101.57.95,client=100.0.0.0/8
    #
    # References:
    # - https://burakberk.dev/split-horizon-dns-on-adguard-one-domain-two-networks-two-ip-addresses/
    # - https://tailscale.com/learn/why-split-dns
    - name: tailscale-sidecar
      image: ghcr.io/tailscale/tailscale:latest
      env:
        - name: TS_KUBE_SECRET
          value: tailscale-auth
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth-bootstrap
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: adguard
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: 'false'
        - name: TS_EXTRA_ARGS
          value: '--advertise-tags=tag:k8s,tag:adguard'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      securityContext:
        capabilities:
           add:
            - NET_ADMIN
  ports:
    # DNS
    - containerPort: 53
      name: dns-udp
      protocol: UDP
    - containerPort: 53
      name: dns-tcp
      protocol: TCP
    # main web interface
    - containerPort: 80
      name: http
      protocol: TCP
    # initial setup web interface
    - containerPort: 3000
      name: setup-http
      protocol: TCP
  volumes:
    adguard-config:
      persistentVolumeClaim:
        claimName: adguard-conf
    adguard-work:
      persistentVolumeClaim:
        claimName: adguard-work
  volumeMounts:
    adguard-config:
       mountPath: /opt/adguardhome/conf
    adguard-work:
       mountPath: /opt/adguardhome/work

rbac:
  enabled: true
  serviceAccount:
    enabled: true
  roles:
    - name: tailscale
      rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "update", "patch", "create"]

service:
  enabled: true
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 80
    - port: 3000
      name: setup-http
      protocol: TCP
      targetPort: 3000

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - adguard.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
        # - name: '{{ include "application.name" $ }}'
        #   port: 80

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: adguard-conf
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Mi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: adguard-work
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Mi
  - apiVersion: v1
    kind: Service
    metadata:
      name: '{{ include "application.name" $ }}-dns'
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.53
        metallb.io/address-pool: adguard-static
    spec:
      selector:
        app.kubernetes.io/name: '{{ include "application.name" $ }}'
      type: LoadBalancer
      ports:
        - port: 53
          name: dns-udp
          protocol: UDP
          targetPort: 53
        - port: 53
          name: dns-tcp
          protocol: TCP
          targetPort: 53
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: tailscale-auth-bootstrap
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: 1password
      target:
        template:
          data:
            # NOTE: Set ephemeral to false to prevent the machine from being
            #       removed when the server/pod goes offline.
            TS_AUTHKEY: "{{ `{{ .clientSecret }}` }}?ephemeral=false"
      data:
        - secretKey: clientSecret
          remoteRef:
            key: Tailscale Operator/clientSecret
