# https://github.com/AdguardTeam/Adguardhome/wiki/Configuration#configuration-file
applicationName: adguard

deployment:
  enabled: true
  image:
    repository: adguard/adguardhome
    tag: v0.107.73
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
    # DNS
    - containerPort: 53
      name: dns-udp
      protocol: UDP
    - containerPort: 53
      name: dns-tcp
      protocol: TCP
    # main web interface
    - containerPort: 80
      name: http
      protocol: TCP
    # initial setup web interface
    - containerPort: 3000
      name: setup-http
      protocol: TCP

service:
  enabled: true
  type: LoadBalancer
  loadBalancerIP: 172.19.1.53
  annotations:
    metallb.universe.tf/address-pool: adguard-static
  ports:
    - port: 53
      name: dns-udp
      protocol: UDP
      targetPort: 53
    - port: 53
      name: dns-tcp
      protocol: TCP
      targetPort: 53
    - port: 80
      name: http
      protocol: TCP
      targetPort: 80
    - port: 3000
      name: setup-http
      protocol: TCP
      targetPort: 3000

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  gatewayNamespace: traefik
  hostnames:
    - adguard.lab.whitworth.nz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ include "application.name" $ }}'
          port: 80
