# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/tags/v39.0.5/traefik/values.schema.json

api:
  dashboard: true
  insecure: false

# Configure Network Ports and EntryPoints
# EntryPoints are the network listeners for incoming traffic.
ports:
  # The port on which Traefik itself will be available. This is used for the dashboard and API.
  traefik:
    port: 8080

  # Defines the HTTP entry point named 'web'
  web:
    port: 80
    nodePort: null
    # Instructs this entry point to redirect all traffic to the 'websecure' entry point
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # Defines the HTTPS entry point named 'websecure'
  websecure:
    asDefault: true
    port: 443
    nodePort: null

ingressRoute:
  dashboard:
    enabled: false

# We will route with Gateway API instead.
ingressClass:
  enabled: false

# Enable Gateway API Provider & Disables the KubernetesIngress provider
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesIngress:
     enabled: false
  kubernetesGateway:
     enabled: true

gateway:
  enabled: false

gatewayClass:
  enabled: false

# Enable Observability
logs:
  general:
    level: INFO
  access:
    enabled: true

# Enables Prometheus for Metrics
metrics:
  prometheus:
    enabled: true
